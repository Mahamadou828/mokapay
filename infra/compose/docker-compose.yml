# Pin the project name: without it compose derives it from this file's
# directory ("compose"), which would produce generic "compose-*" containers.
name: mokapay

networks:
  mokapay.infrastructure:
    driver: bridge
  mokapay.app:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  minio_data:

services:
  postgres:
    image: postgres:17-alpine
    networks:
      - mokapay.infrastructure
    ports:
      # Host 5433 → container 5432 (5432 is often taken on the host).
      - "5433:5432"
    # Local-development-only credentials; production runs in k8s, not compose.
    environment:
      POSTGRES_USER: mokapay
      POSTGRES_PASSWORD: mokapay
      POSTGRES_DB: mokapay
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run once on first cluster init; creates per-service databases.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mokapay"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    networks:
      - mokapay.infrastructure
    ports:
      - "27017:27017"
    # Local-development-only credentials; production runs in k8s, not compose.
    environment:
      MONGO_INITDB_ROOT_USERNAME: mokapay
      MONGO_INITDB_ROOT_PASSWORD: mokapay
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - mokapay.infrastructure
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kept for offline experiments only — nothing points at it. The file
  # service talks to real S3 (see its .env): presigned URLs go to the
  # browser, and a compose-internal endpoint is not resolvable there.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    networks:
      - mokapay.infrastructure
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    # Local-development-only credentials; production uses real S3.
    environment:
      MINIO_ROOT_USER: mokapay
      MINIO_ROOT_PASSWORD: mokapay1234 # MinIO requires >= 8 chars
      # Browser presigned PUTs need CORS on the S3 API. "*" is MinIO's
      # default — pinned here so it survives a default change; production
      # (real S3) sets a bucket CORS policy with the app origins instead.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot bucket provisioning, same spirit as the postgres init scripts:
  # runs on every `up`, but `mb --ignore-existing` makes it a no-op after
  # the first. Exits when done.
  minio-init:
    image: minio/mc
    networks:
      - mokapay.infrastructure
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mokapay mokapay1234 &&
      mc mb --ignore-existing local/mokapay-files
      "

  user:
    build:
      context: ../..
      dockerfile: app/services/user/Dockerfile
      args:
        BUILD_REF: develop
    command: ["--migrate"]
    networks:
      - mokapay.app
      - mokapay.infrastructure
    env_file:
      - ../../app/services/user/.env
    # The .env targets host-side local dev; inside compose the stores live on
    # the infrastructure network under their service names.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Enrollment accept/approve call payment (agent profile, guarantee
      # settlement). No depends_on: payment already depends on user, and
      # the gRPC client dials lazily, so ordering resolves itself.
      PAYMENT_GRPC_PORT: payment:50053
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  file:
    build:
      context: ../..
      dockerfile: app/services/file/Dockerfile
      args:
        BUILD_REF: develop
    command: ["--migrate"]
    networks:
      - mokapay.app
      - mokapay.infrastructure
    env_file:
      - ../../app/services/file/.env
    # The .env targets host-side local dev; inside compose the stores live on
    # the infrastructure network under their service names. Object storage is
    # the exception: S3 is not overridden here, because the endpoint the
    # service signs with is the one the browser is handed.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      USER_GRPC_PORT: user:50051
      PAYMENT_GRPC_PORT: payment:50053
    depends_on:
      postgres:
        condition: service_healthy
      user:
        condition: service_started
      payment:
        condition: service_started

  payment:
    build:
      context: ../..
      dockerfile: app/services/payment/Dockerfile
      args:
        BUILD_REF: develop
    command: ["--migrate"]
    networks:
      - mokapay.app
      - mokapay.infrastructure
    env_file:
      - ../../app/services/payment/.env
    # The .env targets host-side local dev; inside compose the stores live on
    # the infrastructure network under their service names.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      USER_GRPC_PORT: user:50051
      FILE_GRPC_PORT: file:50052
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user:
        condition: service_started

  gateway:
    build:
      context: ../..
      dockerfile: app/services/gateway/Dockerfile
      args:
        BUILD_REF: develop
    networks:
      - mokapay.app
    ports:
      # Host 8085 → container 8080 (8080 is often taken on the host).
      - "8085:8080"
    env_file:
      - ../../app/services/gateway/.env
    # Inside compose the downstream services live on the app network under
    # their service names.
    environment:
      USER_GRPC_PORT: user:50051
      PAYMENT_GRPC_PORT: payment:50053
      FILE_GRPC_PORT: file:50052
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user:
        condition: service_started
      payment:
        condition: service_started
      file:
        condition: service_started
