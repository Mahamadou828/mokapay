syntax = "proto3";

package payment.v1;

import "file/v1/shared_message.proto";
import "google/protobuf/empty.proto";
import "payment/v1/shared_message.proto";

// The client-facing transfer surface. Passport policy: everything is
// owner-scoped from the passport identity, except UpdateTransferStatus
// (system-only — the file worker's proof path; a proof upload must never
// be able to reach done or move money) and the reads ops also gets.
service TransferService {
  // The v1 operator catalogue for a corridor; rejects cdf→usd.
  rpc GetAvailableOperators(GetAvailableOperatorsRequest) returns (GetAvailableOperatorsResponse);
  // Stateless: computed from the cached rate, nothing persisted. The
  // rate locks at CreateTransfer.
  rpc GetQuote(GetQuoteRequest) returns (Quote);
  rpc CreateTransfer(CreateTransferRequest) returns (Transfer);
  rpc GetTransfer(GetTransferRequest) returns (Transfer);          // owner, assigned agent, or ops
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);  // mine (client side)
  rpc ListTransferEvents(ListTransferEventsRequest) returns (ListTransferEventsResponse);
  // The proofs attached to a transfer, readable by every party — the
  // file service only knows owners; the party scope (client, assigned
  // agent, ops) is enforced here and the files are fetched internally.
  rpc ListTransferFiles(ListTransferFilesRequest) returns (ListTransferFilesResponse);
  // pending_client_confirmation → done; releases the agent's hold.
  rpc ConfirmReceipt(ConfirmReceiptRequest) returns (Transfer);
  // Owner cancel, pre-accept only (no hold yet).
  rpc CancelTransfer(CancelTransferRequest) returns (Transfer);
  // Freeze a contested transfer. Callable by either party of a
  // post-accept transfer (the owner, or the assigned agent claiming
  // client fraud); the agent's guarantee stays held until ops rules.
  rpc OpenDispute(OpenDisputeRequest) returns (Dispute);
  rpc ListBeneficiaries(ListBeneficiariesRequest) returns (ListBeneficiariesResponse);
  // Save a recipient ahead of any transfer (D7). Idempotent on the
  // caller's (phone) pair: re-adding a live one refreshes its details —
  // same upsert CreateTransfer uses for inline recipients.
  rpc AddBeneficiary(AddBeneficiaryRequest) returns (Beneficiary);
  // Owner-scoped partial update; absent fields keep their value.
  rpc UpdateBeneficiary(UpdateBeneficiaryRequest) returns (Beneficiary);
  rpc DeleteBeneficiary(DeleteBeneficiaryRequest) returns (google.protobuf.Empty);
  // SYSTEM-ONLY: the file worker reports proofs; forward-only between
  // the proof-gated pendings, can never reach done.
  rpc UpdateTransferStatus(UpdateTransferStatusRequest) returns (Transfer);
}

message GetAvailableOperatorsRequest {
  Currency from_currency = 1;
  Currency to_currency = 2;
}

message GetAvailableOperatorsResponse {
  repeated Operator operators = 1;
}

message GetQuoteRequest {
  Currency from_currency = 1;
  // Exactly one of from_amount / to_amount is set — the two directions
  // of the send widget. from_amount: "you send X, what does the
  // recipient get?"; to_amount: "the recipient must get Y, what do I
  // send?" (the server solves for the smallest from_amount whose quote
  // covers Y — the response's to_amount may exceed Y by a rounding sliver).
  int64 from_amount = 2;           // minor units, source-denominated
  Currency to_currency = 3;
  optional int64 to_amount = 4;    // minor units, target-denominated
}

message CreateTransferRequest {
  Currency from_currency = 1;
  Operator from_operator = 2;
  int64 from_amount = 3;
  Currency to_currency = 4;
  // Either a saved beneficiary or inline recipient details (which also
  // save/refresh the beneficiary).
  optional string beneficiary_id = 5;
  optional string recipient_name = 6;
  optional string recipient_phone = 7;
  optional Operator recipient_operator = 8;
  optional string recipient_city = 9;
  optional string note = 10;
}

message GetTransferRequest {
  string id = 1;
}

message ListTransfersRequest {
  optional TransferStatus status = 1;
  int32 limit = 2;  // 0 = server default
}

message ListTransfersResponse {
  repeated Transfer transfers = 1;
}

message ListTransferEventsRequest {
  string transfer_id = 1;
}

message ListTransferEventsResponse {
  repeated TransferEvent events = 1;
}

message ListTransferFilesRequest {
  string transfer_id = 1;
}

message TransferFile {
  file.v1.File file = 1;
  // Presigned GET, only once the file is stored.
  optional string download_url = 2;
  optional int64 download_url_expires_in = 3;  // seconds
}

message ListTransferFilesResponse {
  repeated TransferFile files = 1;
}

message ConfirmReceiptRequest {
  string id = 1;
}

message CancelTransferRequest {
  string id = 1;
  optional string reason = 2;
}

message OpenDisputeRequest {
  string id = 1;                 // the transfer
  DisputeReason reason = 2;
  optional string details = 3;   // what the party says happened
}

message ListBeneficiariesRequest {}

message ListBeneficiariesResponse {
  repeated Beneficiary beneficiaries = 1;
}

message AddBeneficiaryRequest {
  string name = 1;
  string phone = 2;      // where the recipient is paid, off-platform
  Operator operator = 3;
  optional string city = 4;
}

message UpdateBeneficiaryRequest {
  string id = 1;
  optional string name = 2;
  optional string phone = 3;      // must stay unique among the caller's live recipients
  optional Operator operator = 4;
  optional string city = 5;
}

message DeleteBeneficiaryRequest {
  string id = 1;
}

message UpdateTransferStatusRequest {
  string id = 1;
  TransferStatus status = 2;      // pending_agent_transfer or pending_client_confirmation only
  string proof_file_id = 3;       // the uploaded proof driving the move
}
