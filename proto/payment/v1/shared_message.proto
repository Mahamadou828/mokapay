syntax = "proto3";

package payment.v1;

import "google/protobuf/timestamp.proto";

// Values mirror the payments DB enums (agent_profile_status, agent_level,
// ledger_request_type, ledger_request_status, ledger_direction) —
// conversion is a plain cast.

enum AgentProfileStatus {
  AGENT_PROFILE_STATUS_UNSPECIFIED = 0;
  AGENT_PROFILE_STATUS_PENDING = 1;
  AGENT_PROFILE_STATUS_ACTIVE = 2;
  AGENT_PROFILE_STATUS_SUSPENDED = 3;
}

enum AgentLevel {
  AGENT_LEVEL_UNSPECIFIED = 0;
  AGENT_LEVEL_N1 = 1;
  AGENT_LEVEL_N2 = 2;
  AGENT_LEVEL_N3 = 3;
  AGENT_LEVEL_N4 = 4;
}

enum LedgerRequestType {
  LEDGER_REQUEST_TYPE_UNSPECIFIED = 0;
  LEDGER_REQUEST_TYPE_FUNDING = 1;
  LEDGER_REQUEST_TYPE_WITHDRAWAL = 2;
  LEDGER_REQUEST_TYPE_REFUND = 3;
  LEDGER_REQUEST_TYPE_DEDUCTION = 4;
  LEDGER_REQUEST_TYPE_COMMISSION = 5;
}

enum LedgerRequestStatus {
  LEDGER_REQUEST_STATUS_UNSPECIFIED = 0;
  LEDGER_REQUEST_STATUS_INITIATED = 1;
  LEDGER_REQUEST_STATUS_PENDING_AGENT_ACTION = 2;
  LEDGER_REQUEST_STATUS_PENDING_ADMIN_APPROVAL = 3;
  LEDGER_REQUEST_STATUS_DONE = 4;
  LEDGER_REQUEST_STATUS_REJECTED = 5;
  LEDGER_REQUEST_STATUS_DISPUTED = 6;  // reserved, transfers volley
}

// Whether a request increases or decreases the balance — deliberately not
// credit/debit (that vocabulary flips with the point of view).
enum LedgerDirection {
  LEDGER_DIRECTION_UNSPECIFIED = 0;
  LEDGER_DIRECTION_INFLOW = 1;
  LEDGER_DIRECTION_OUTFLOW = 2;
}

// What a referenced request settles. At most one live-or-settled request
// per entity (rejected ones free the slot); free-standing requests carry
// no reference.
enum LedgerReferenceType {
  LEDGER_REFERENCE_TYPE_UNSPECIFIED = 0;
  LEDGER_REFERENCE_TYPE_ENROLLMENT = 1;
  LEDGER_REFERENCE_TYPE_TRANSFER = 2;
}

// The agent's money account. balance moves only through the ledger;
// available = balance − held is derived, never stored.
message AgentProfile {
  string id = 1;
  string account_id = 2;  // user-service account
  AgentProfileStatus status = 3;
  AgentLevel level = 4;
  string currency = 5;         // denomination of the amounts below
  int64 balance = 6;           // minor units
  int64 held = 7;              // reserved by open outflow requests
  int64 available = 8;         // balance − held
  int64 guarantee_floor = 9;   // not withdrawable
  optional string city = 10;   // geo matching input
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// The mutable workflow object — the only path to a balance change. An
// open outflow request IS a reservation on the profile's held.
message LedgerRequest {
  string id = 1;
  string agent_profile_id = 2;
  LedgerRequestType type = 3;
  LedgerDirection direction = 4;
  int64 amount = 5;  // minor units, always positive; sign lives in direction
  LedgerRequestStatus status = 6;
  optional LedgerReferenceType reference_entity_type = 7;  // with reference_entity_id or not at all
  optional string reference_entity_id = 8;
  optional string proof_file_id = 9;   // file-service NK
  optional string reason = 10;
  optional string decided_by = 11;     // deciding admin's account id
  optional google.protobuf.Timestamp decided_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // Human reference (DEP-2026-000042, prefix by type): what the agent
  // copies as the motif of the off-platform payment.
  string ref = 15;
}

// One immutable settlement record.
message LedgerLine {
  string id = 1;
  string agent_profile_id = 2;
  string ledger_request_id = 3;
  int64 amount = 4;         // SIGNED: inflow +, outflow −
  int64 balance_after = 5;
  google.protobuf.Timestamp created_at = 6;
}

// ---------------------------------------------------------------------------
// Transfers (values mirror the currency, payment_operator, transfer_status
// and offer_status DB enums — conversion is a plain cast).

// The send ladder is one-way: every value but CDF is a source a client can
// fund with, and CDF is what the recipient is always paid in.
enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_USD = 1;
  CURRENCY_CDF = 2;
  CURRENCY_EUR = 3;
  CURRENCY_ZAR = 4;
  CURRENCY_AOA = 5;
  CURRENCY_ZMW = 6;
  CURRENCY_TZS = 7;
}

// The account catalogue an agent can hold a wallet on. Not all of them are
// mobile money any more: the last two are banks, so the account number
// behind an operator is an MSISDN or an RIB depending on the value (see
// AgentWallet.kind).
enum Operator {
  OPERATOR_UNSPECIFIED = 0;
  OPERATOR_ORANGE_MONEY = 1;
  OPERATOR_M_PESA = 2;
  OPERATOR_AIRTEL_MONEY = 3;
  OPERATOR_AFRIMONEY = 4;
  OPERATOR_RAWBANK = 5;
  OPERATOR_EQUITY_BCDC = 6;
}

enum TransferStatus {
  TRANSFER_STATUS_UNSPECIFIED = 0;
  TRANSFER_STATUS_PENDING_MATCH = 1;
  TRANSFER_STATUS_PENDING_AGENT_APPROVAL = 2;
  TRANSFER_STATUS_PENDING_CLIENT_TRANSFER = 3;
  TRANSFER_STATUS_PENDING_AGENT_TRANSFER = 4;
  TRANSFER_STATUS_PENDING_CLIENT_CONFIRMATION = 5;
  TRANSFER_STATUS_DONE = 6;
  TRANSFER_STATUS_CANCELLED = 7;
  TRANSFER_STATUS_EXPIRED = 8;
  TRANSFER_STATUS_DISPUTED = 9;
  // The dispute path's own terminal: agent at fault, guarantee captured,
  // client refunded from it.
  TRANSFER_STATUS_REFUNDED = 10;
}

enum OfferStatus {
  OFFER_STATUS_UNSPECIFIED = 0;
  OFFER_STATUS_OFFERED = 1;
  OFFER_STATUS_ACCEPTED = 2;
  OFFER_STATUS_DECLINED = 3;
  OFFER_STATUS_VOIDED = 4;   // a sibling offer won the race
  OFFER_STATUS_EXPIRED = 5;
}

// Where the client sends the money after a match: the matched agent's
// wallet on the transfer's {from_operator, from_currency} pair.
message AgentPaymentDetails {
  Operator operator = 1;
  string account_number = 2;  // was msisdn — an MSISDN or a bank account
  string kind = 3;            // "mobile_money" | "bank", derived from operator
}

// The transfer. Every money field was stamped at create (rate locked
// once) and never changes; amounts are minor units (usd = cents,
// cdf = whole francs), decimals travel as strings.
message Transfer {
  string id = 1;
  string reference = 2;  // MKP-YYYY-NNNNNN
  string client_id = 3;
  optional string beneficiary_id = 4;
  string recipient_name = 5;
  string recipient_phone = 6;
  Operator recipient_operator = 7;
  optional string recipient_city = 8;
  Currency from_currency = 9;
  Operator from_operator = 10;
  int64 from_amount = 11;
  Currency to_currency = 12;
  int64 to_amount = 13;
  string fee_pct = 14;          // e.g. "2.00"
  int64 fee_amount = 15;        // from_currency minor units
  int64 margin_amount = 16;     // to_currency; 0 on same-currency
  int64 total_amount = 17;      // from_amount + fee_amount
  optional string rate = 18;    // absent = same-currency corridor
  int64 hold_amount = 19;       // USD minor units, reserved at accept
  optional string note = 20;
  TransferStatus status = 21;
  optional string agent_profile_id = 22;
  int32 match_round = 23;
  optional string proof_client_file_id = 24;
  optional string proof_agent_file_id = 25;
  // Populated only for the transfer's owner once matched.
  optional AgentPaymentDetails agent_payment_details = 26;
  google.protobuf.Timestamp created_at = 27;
  google.protobuf.Timestamp updated_at = 28;
}

// One immutable timeline row (C13). from_status absent = the birth row;
// actor absent = system/timer.
message TransferEvent {
  string id = 1;
  string transfer_id = 2;
  optional string actor_id = 3;
  optional TransferStatus from_status = 4;
  TransferStatus to_status = 5;
  optional string reason = 6;
  google.protobuf.Timestamp created_at = 7;
}

// The agent-inbox offer: the slot plus the money summary the agent
// decides on.
message Offer {
  string id = 1;
  string transfer_id = 2;
  string agent_profile_id = 3;
  int32 match_round = 4;
  int32 score = 5;
  OfferStatus status = 6;
  google.protobuf.Timestamp expires_at = 7;
  optional google.protobuf.Timestamp decided_at = 8;
  google.protobuf.Timestamp created_at = 9;
  string transfer_reference = 10;
  Currency from_currency = 11;
  Operator from_operator = 12;
  int64 from_amount = 13;
  Currency to_currency = 14;
  Operator recipient_operator = 15;
  optional string recipient_city = 16;
  int64 to_amount = 17;
  int64 total_amount = 18;
  int64 hold_amount = 19;  // what accepting reserves, USD minor units
  optional string note = 20;
}

// A saved recipient (D7).
message Beneficiary {
  string id = 1;
  string client_id = 2;
  string name = 3;
  string phone = 4;
  Operator operator = 5;
  optional string city = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// An agent's declared operator channel; account_number is what the client
// pays to — an MSISDN on a mobile-money operator, a bank account number on
// a bank one.
message AgentWallet {
  string id = 1;
  string agent_profile_id = 2;
  Operator operator = 3;
  reserved 4;  // was currency — one wallet per operator now, flags below
  string account_number = 5;  // was msisdn
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool accepts_usd = 8;
  bool accepts_cdf = 9;
  // "mobile_money" | "bank" — derived from the operator, never stored;
  // it tells the client whether to render a phone or an account number.
  string kind = 10;
}

// ---------------------------------------------------------------------------
// Commissions (values mirror the commission_status DB enum — conversion is
// a plain cast).

// Derived, never stored: unbatched is `accrued`, batched becomes `paid`
// once the batch's ledger request settles.
enum CommissionStatus {
  COMMISSION_STATUS_UNSPECIFIED = 0;
  COMMISSION_STATUS_ACCRUED = 1;
  COMMISSION_STATUS_BATCHED = 2;
  COMMISSION_STATUS_PAID = 3;
}

// One transfer's accrual: the 60/30/10 split of the fee (flat for every
// agent level) plus the FX margin, which is 100% platform. The fee shares
// are in the transfer's from_currency and the margin in its to_currency —
// they are deliberately never added together.
message Commission {
  string id = 1;
  string transfer_id = 2;
  string transfer_reference = 3;
  string agent_profile_id = 4;
  Currency fee_currency = 5;
  int64 fee_amount = 6;
  int64 agent_amount = 7;            // 60% of the fee
  int64 platform_amount = 8;         // 30% of the fee
  int64 guarantee_fund_amount = 9;   // the remaining ~10%
  Currency margin_currency = 10;
  int64 margin_amount = 11;          // 100% platform, on top
  // What the weekly batch credits: the agent's share in the guarantee
  // balance's denomination (USD minor units), converted at the transfer's
  // own locked rate.
  int64 payable_amount = 12;
  string accounting_week = 13;       // YYYY-MM-DD, the Tuesday opening the week
  optional string batch_id = 14;     // absent until the weekly run picks it up
  CommissionStatus status = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

// One agent's weekly payout: the accruals of an accounting week grouped
// behind a single `commission` ledger request. Approving that request is
// what actually moves the balance.
message CommissionBatch {
  string id = 1;
  string agent_profile_id = 2;
  string accounting_week = 3;   // YYYY-MM-DD
  int32 commission_count = 4;
  int64 total_amount = 5;       // USD minor units
  string ledger_request_id = 6;
  string ledger_request_ref = 7;  // COM-2026-000042
  CommissionStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// ---------------------------------------------------------------------------
// Disputes (values mirror the dispute_* and hold_outcome DB enums).

enum DisputeParty {
  DISPUTE_PARTY_UNSPECIFIED = 0;
  DISPUTE_PARTY_CLIENT = 1;
  DISPUTE_PARTY_AGENT = 2;
  DISPUTE_PARTY_SYSTEM = 3;  // the payout-timeout auto-dispute
}

enum DisputeReason {
  DISPUTE_REASON_UNSPECIFIED = 0;
  DISPUTE_REASON_AGENT_NOT_PAID = 1;
  DISPUTE_REASON_RECIPIENT_NOT_RECEIVED = 2;
  DISPUTE_REASON_CLIENT_FRAUD = 3;
  DISPUTE_REASON_OTHER = 4;
}

enum DisputeStatus {
  DISPUTE_STATUS_UNSPECIFIED = 0;
  DISPUTE_STATUS_OPEN = 1;
  DISPUTE_STATUS_RESOLVED = 2;
}

// The admin ruling. Each value fixes the whole money outcome: hold
// released or captured, client refunded or not, and where the transfer
// lands.
enum DisputeResolution {
  DISPUTE_RESOLUTION_UNSPECIFIED = 0;
  DISPUTE_RESOLUTION_AGENT_RIGHT = 1;   // release, no refund, done
  DISPUTE_RESOLUTION_AGENT_FAULT = 2;   // capture, refund the client, refunded
  DISPUTE_RESOLUTION_CLIENT_FRAUD = 3;  // release, no refund, done
  DISPUTE_RESOLUTION_NO_FAULT = 4;      // release, no refund, cancelled
}

enum HoldOutcome {
  HOLD_OUTCOME_UNSPECIFIED = 0;
  HOLD_OUTCOME_RELEASED = 1;
  HOLD_OUTCOME_CAPTURED = 2;
}

// A contested transfer. While the dispute is open the transfer sits in
// `disputed` and the agent's guarantee STAYS held — it is the collateral
// that funds the fix.
message Dispute {
  string id = 1;
  string transfer_id = 2;
  string transfer_reference = 3;
  string client_id = 4;
  optional string agent_profile_id = 5;
  DisputeParty opened_by_party = 6;
  optional string opened_by = 7;   // absent = system auto-dispute
  DisputeReason reason = 8;
  optional string details = 9;
  // Snapshot taken when the transfer froze.
  TransferStatus from_status = 10;
  int64 hold_amount = 11;          // USD minor units, frozen while open
  Currency refund_currency = 12;
  int64 refund_amount = 13;        // what the client would be owed back
  DisputeStatus status = 14;
  optional DisputeResolution resolution = 15;
  optional HoldOutcome hold_outcome = 16;
  optional string resolution_note = 17;
  // The capture's ledger request, on agent_fault.
  optional string deduction_ledger_request_id = 18;
  optional string resolved_by = 19;
  optional google.protobuf.Timestamp resolved_at = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

// A stateless quote: nothing persisted — the rate locks at
// CreateTransfer, and the cache TTL bounds the drift in between.
message Quote {
  Currency from_currency = 1;
  int64 from_amount = 2;
  Currency to_currency = 3;
  int64 to_amount = 4;
  string fee_pct = 5;
  int64 fee_amount = 6;
  int64 margin_amount = 7;
  int64 total_amount = 8;
  optional string rate = 9;  // absent = same-currency corridor
}
