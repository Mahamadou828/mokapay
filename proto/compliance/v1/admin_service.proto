syntax = "proto3";

package compliance.v1;

import "google/protobuf/empty.proto";
import "compliance/v1/shared_message.proto";

// The staff review surface: the alert worklist, case management and the
// risk/dashboard reads. Mounted on the gateway's ops tier; the handlers
// re-check the forwarded passport themselves (ops/admin only).
service AdminService {
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  rpc GetAlert(GetAlertRequest) returns (Alert);
  // The review lifecycle. resolution_note is required when moving to a
  // closing status (resolved/dismissed) — a closed alert always says why.
  rpc UpdateAlertStatus(UpdateAlertStatusRequest) returns (Alert);
  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  // The reference (CASE-YYYY-NNNNNN) is generated server-side, never
  // supplied by the caller — same as MKP-/DEP-.
  rpc CreateCase(CreateCaseRequest) returns (Case);
  // Partial update; moving to closed_sar/closed_no_action stamps closed_at.
  rpc UpdateCase(UpdateCaseRequest) returns (Case);
  // Idempotent: linking an already-linked alert succeeds unchanged.
  rpc AddAlertToCase(AddAlertToCaseRequest) returns (google.protobuf.Empty);
  // The 90-day rolling score plus its configured level band.
  rpc GetAccountRisk(GetAccountRiskRequest) returns (AccountRisk);
  rpc GetDashboard(GetDashboardRequest) returns (ComplianceDashboard);
}

message ListAlertsRequest {
  optional AlertStatus status = 1;
  optional Severity severity = 2;
  optional string account_id = 3;
  int32 limit = 4;  // 0 = server default
}

message ListAlertsResponse {
  repeated Alert alerts = 1;
}

message GetAlertRequest {
  string id = 1;
}

message UpdateAlertStatusRequest {
  string id = 1;
  AlertStatus status = 2;
  optional string assignee_id = 3;
  optional string resolution_note = 4;
}

message ListCasesRequest {
  optional CaseStatus status = 1;
  int32 limit = 2;  // 0 = server default
}

message ListCasesResponse {
  repeated Case cases = 1;
}

message CreateCaseRequest {
  optional string summary = 1;
}

message UpdateCaseRequest {
  string id = 1;
  optional CaseStatus status = 2;
  optional string assignee_id = 3;
  optional string summary = 4;
}

message AddAlertToCaseRequest {
  string case_id = 1;
  string alert_id = 2;
}

message GetAccountRiskRequest {
  string account_id = 1;
}

message GetDashboardRequest {}
