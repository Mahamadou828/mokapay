syntax = "proto3";

package user.v1;

import "user/v1/shared_message.proto";

// Self-service: the caller is always the identity forwarded by the gateway
// in gRPC metadata — no account id in any request. GetAccountBySub is the
// one exception: it is the gateway-internal lookup that rehydrates the
// passport's user data right after token validation (never exposed as a
// REST route).
service UserService {
  rpc Me(MeRequest) returns (Account);
  rpc UpdateAccount(UpdateAccountRequest) returns (Account);
  rpc GetAccountBySub(GetAccountBySubRequest) returns (Account);

  // Agent enrollment, candidate side. GetMyEnrollment returns the latest
  // request whatever its status (NotFound if never invited); accept stamps
  // the TOS version the client displayed; decline only works before
  // accepting — afterwards the exit is an admin cancel.
  rpc GetMyEnrollment(GetMyEnrollmentRequest) returns (Enrollment);
  rpc AcceptEnrollment(AcceptEnrollmentRequest) returns (Enrollment);
  rpc DeclineEnrollment(DeclineEnrollmentRequest) returns (Enrollment);
  // Self-serve enrollment (AG-04): no invite, no inviter. The terms are
  // stamped inline — this single call is both the creation and the
  // acceptance — and the request lands in ACCEPTED with its guarantee
  // funding already open. Retrying resumes the live self-serve request
  // instead of failing.
  rpc SelfEnroll(SelfEnrollRequest) returns (Enrollment);
}

message MeRequest {}

message GetAccountBySubRequest {
  string sub = 1; // Cognito sub from the validated access token
}

message UpdateAccountRequest {
  optional string first_name = 1;
  optional string last_name = 2;
  optional string email = 3;
  optional Language preferred_language = 4;
  optional OtpMethod preferred_otp_method = 5;
}

message GetMyEnrollmentRequest {}

message AcceptEnrollmentRequest {
  string id = 1;           // enrollment id
  string tos_version = 2;  // the terms version the client displayed
}

message DeclineEnrollmentRequest {
  string id = 1;  // enrollment id
}

message SelfEnrollRequest {
  string tos_version = 1;   // the terms version the client displayed
  optional string city = 2; // nearest city, seeds the agent profile (geo matching)
}
