syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

// Values mirror the users DB enums (account_role, account_status,
// account_language, otp_method, otp_purpose) — conversion is a plain cast.

enum AccountRole {
  ACCOUNT_ROLE_UNSPECIFIED = 0;
  ACCOUNT_ROLE_USER = 1;
  ACCOUNT_ROLE_PENDING_AGENT = 2;
  ACCOUNT_ROLE_AGENT = 3;
  ACCOUNT_ROLE_OPS = 4;
  ACCOUNT_ROLE_ADMIN = 5;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_PENDING = 1;
  ACCOUNT_STATUS_ACTIVE = 2;
  ACCOUNT_STATUS_SUSPENDED = 3;
  ACCOUNT_STATUS_BANNED = 4;
}

enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_FR = 1;
  LANGUAGE_EN = 2;
}

// How an account wants its login/reset OTP delivered. Registration is
// always SMS — no account row exists yet to hold a preference.
enum OtpMethod {
  OTP_METHOD_UNSPECIFIED = 0;
  OTP_METHOD_SMS = 1;
  OTP_METHOD_EMAIL = 2;
}

enum OtpPurpose {
  OTP_PURPOSE_UNSPECIFIED = 0;
  OTP_PURPOSE_REGISTER = 1;
  OTP_PURPOSE_LOGIN = 2;
  OTP_PURPOSE_RESET = 3;
}

// The single identity row for every human in the system.
// No password field anywhere — hashes never cross the wire.
message Account {
  string id = 1;
  string phone_number = 2;  // E.164
  string first_name = 3;
  string last_name = 4;
  optional string email = 5;
  Language preferred_language = 6;
  AccountRole role = 7;
  AccountStatus status = 8;
  optional google.protobuf.Timestamp last_login_at = 9;  // absent if never logged in
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  OtpMethod preferred_otp_method = 12;
}

// Values mirror the users DB enrollment_status enum.
enum EnrollmentStatus {
  ENROLLMENT_STATUS_UNSPECIFIED = 0;
  ENROLLMENT_STATUS_INVITED = 1;
  ENROLLMENT_STATUS_ACCEPTED = 2;
  ENROLLMENT_STATUS_DECLINED = 3;
  ENROLLMENT_STATUS_APPROVED = 4;
  ENROLLMENT_STATUS_CANCELLED = 5;
}

// One agent-enrollment request. Two entry points share this shape:
//   - invited: an ops/admin invite → TOS acceptance → admin approval;
//     invited_by names the inviter.
//   - self-serve: the candidate signs themselves up (AG-03/AG-04),
//     stamping the terms at creation and landing straight in ACCEPTED;
//     invited_by is ABSENT, which is what tells the two apart. Its route
//     to APPROVED is the guarantee deposit being validated by ops, not a
//     separate decision on the enrollment.
// Shared by AdminService (invite, approve, cancel, list) and UserService
// (view, self-enroll, accept, decline).
message Enrollment {
  string id = 1;
  string account_id = 2;           // the candidate
  optional string invited_by = 3;  // the ops/admin who invited; absent = self-serve
  EnrollmentStatus status = 4;
  optional string tos_version = 5;                       // set once accepted
  optional google.protobuf.Timestamp tos_accepted_at = 6;
  optional string decided_by = 7;  // admin on approve/cancel, candidate on decline
  optional google.protobuf.Timestamp decided_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
