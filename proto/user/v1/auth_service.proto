syntax = "proto3";

package user.v1;

import "google/protobuf/empty.proto";
import "user/v1/shared_message.proto";

// Phone + password + SMS-OTP second factor, backed by AWS Cognito (it owns
// credentials and sessions; this service owns accounts and OTP codes).
// Login is a single call: the client obtains a LOGIN OTP via SendOtp, then
// sends phone + password + code together. Token validation happens at the
// gateway, locally against the Cognito JWKS — there is no validation RPC.
service AuthService {
  rpc SendOtp(SendOtpRequest) returns (SendOtpResponse);
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);
}

message SendOtpRequest {
  string phone_number = 1;
  OtpPurpose purpose = 2;
}

// Never carries the code — delivery is SMS only.
message SendOtpResponse {
  int64 expires_in_seconds = 1;
}

message RegisterRequest {
  string phone_number = 1;
  string code = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
  Language preferred_language = 6;
  optional string email = 7;
}

message LoginRequest {
  string phone_number = 1;
  string password = 2;
  string code = 3; // LOGIN OTP obtained via SendOtp
}

// Cognito derives the refresh SECRET_HASH from the user's sub; the client
// reads it from its access token's `sub` claim.
message RefreshTokenRequest {
  string refresh_token = 1;
  string sub = 2;
}

// Caller identity comes from the gateway metadata; Cognito global sign-out
// revokes every refresh token of the account.
message LogoutRequest {}

message ChangePasswordRequest {
  string code = 1; // RESET OTP obtained via SendOtp
  string new_password = 2;
  string phone_number = 3;
}

// Tokens only — the profile is fetched via UserService.Me.
message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_in = 3; // seconds
}
