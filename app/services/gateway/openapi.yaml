openapi: 3.0.3
info:
  title: Gateway API
  version: "1.0.0"
  description: >
    REST gateway over the project's gRPC services. Each endpoint proxies to a
    gRPC RPC; request/response bodies are proto3-JSON (snake_case field names,
    enums as their full string names, int64 as JSON strings, timestamps as
    RFC 3339). List filters are passed as query parameters; create/update
    bodies mirror the corresponding gRPC request message. Errors map gRPC
    status codes to HTTP and return an Error body.

servers:
  - url: http://localhost:8080
    description: Local gateway (go run)
  - url: http://localhost:8085
    description: Docker compose gateway (host 8085 → container 8080)

tags:
  - name: Health
  - name: Auth
    description: Anonymous authentication flows (Cognito-backed, SMS-OTP second factor)
  - name: Account
    description: Self-service account routes — the caller is the token's identity
  - name: Notifications
    description: In-app inbox + web-push subscription management (self-service)
  - name: Enrollment
    description: >
      Agent enrollment — the candidate side (view, accept terms, decline);
      the admin side lives under the Admin tag
  - name: Admin
    description: Account moderation — requires the ops or admin role
  - name: Transfers
    description: >
      The client transfer flow — operators, stateless quote, create (rate
      locked once), reads, receipt confirmation, pre-accept cancel, saved
      beneficiaries. Amounts are minor units (USD cents; CDF whole francs).
  - name: Agent
    description: >
      The agent surface — profile, broadcast-offer inbox, accept/decline,
      assignments, wallet self-service. Requires the agent role
      (pending_agent may read profile/wallets).
  - name: PaymentAdmin
    description: Transfer moderation — requires the ops or admin role
  - name: Files
    description: >
      Proof uploads (presign + confirm): POST /v1/files returns a
      short-lived presigned PUT URL, the browser sends the bytes straight
      to object storage, then confirms. Reads return 1-hour presigned
      GETs. Owner-scoped service-side.
  - name: Ledger
    description: >
      The guarantee ledger — agent side (own funding/withdrawal requests +
      statement, scope pinned service-side) and ops side (worklist,
      approve/reject = the only paths that move a balance, agent-profile
      lifecycle). Amounts are USD minor units.

paths:
  /v1/readiness:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: readiness
      responses:
        "204":
          description: Service ready

  /v1/liveness:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: liveness
      responses:
        "204":
          description: Service alive

  /v1/auth/otp:
    post:
      tags: [Auth]
      summary: Send an SMS OTP
      description: >
        Sends a one-time code by SMS for the given purpose (register, login or
        password reset). The code never appears in the response.
      operationId: sendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOtpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: >
        Creates the account (Cognito + local row). Requires a REGISTER OTP
        obtained via /v1/auth/otp.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Account created, session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Phone number or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: >
        Single call: phone + password + LOGIN OTP (obtained via /v1/auth/otp)
        together. Suspended/banned accounts are rejected.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the session
      description: >
        Exchanges a refresh token for new tokens. `sub` is the Cognito subject
        read from the access token's `sub` claim (Cognito derives the refresh
        SECRET_HASH from it).
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/auth/password:
    post:
      tags: [Auth]
      summary: Reset the password
      description: >
        Sets a new password using a RESET OTP obtained via /v1/auth/otp.
        Anonymous — this is the forgot-password flow.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out everywhere
      description: >
        Cognito global sign-out — revokes every refresh token of the calling
        account. The access token stays valid until it expires.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/me:
    get:
      tags: [Account]
      summary: Get my account
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    patch:
      tags: [Account]
      summary: Update my account
      description: Partial update — absent fields keep their stored value.
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/push/vapid-key:
    get:
      tags: [Notifications]
      summary: VAPID public key
      description: >
        The application server key the frontend passes to
        PushManager.subscribe(). Empty when the backend runs without VAPID
        keys (dev mode — pushes are logged, not delivered).
      operationId: getVapidPublicKey
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key:
                    type: string

  /v1/notifications:
    get:
      tags: [Notifications]
      summary: List my notifications
      description: The caller's inbox, newest first.
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NotificationStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            description: Max rows (default 50, cap 200)
      responses:
        "200":
          description: The inbox slice
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification read
      description: Idempotent — re-reading keeps the original read timestamp.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all my notifications read
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Backlog cleared
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/push/subscriptions:
    post:
      tags: [Notifications]
      summary: Register this device for web push
      description: >
        Body is the flattened PushSubscription from PushManager.subscribe().
        Re-subscribing the same endpoint refreshes the keys (upsert). The
        device hint is taken from the User-Agent header.
      operationId: subscribePush
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribePushRequest"
      responses:
        "204":
          description: Subscribed
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    delete:
      tags: [Notifications]
      summary: Unregister this device
      description: Unknown endpoints no-op (unsubscribe is idempotent).
      operationId: unsubscribePush
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
              required: [endpoint]
      responses:
        "204":
          description: Unsubscribed
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/enrollment:
    get:
      tags: [Enrollment]
      summary: My enrollment
      description: The caller's latest enrollment request, whatever its status.
      operationId: getMyEnrollment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          description: Never invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/enrollment/accept:
    post:
      tags: [Enrollment]
      summary: Accept the agent terms
      description: >
        Stamps the TOS acceptance. tos_version must be the current version —
        a stale one (the client displayed outdated terms) is rejected with
        failed_precondition. Only works while the enrollment is invited.
        Accepting also opens the guarantee funding request automatically
        (amount = the profile's guarantee floor, referenced to this
        enrollment, status pending_agent_action) — no admin step in
        between; the candidate finds it at GET /v1/agent/ledger/requests.
      operationId: acceptEnrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: The enrollment id (from GET /v1/enrollment)
                tos_version:
                  type: string
                  example: "1.0"
              required: [id, tos_version]
      responses:
        "200":
          description: The accepted enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid id, or stale tos_version (failed_precondition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/enrollment/decline:
    post:
      tags: [Enrollment]
      summary: Decline the invitation
      description: >
        Restores the user role. Only works while the enrollment is invited —
        after accepting the terms, exiting goes through an admin cancel.
      operationId: declineEnrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
              required: [id]
      responses:
        "200":
          description: The declined enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/enrollments:
    get:
      tags: [Admin]
      summary: List enrollments
      description: The enrollment dashboard; filter by status to find the worklist.
      operationId: listEnrollments
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EnrollmentStatus"
      responses:
        "200":
          description: Matching enrollments, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/accounts/{id}/promote:
    post:
      tags: [Admin]
      summary: Invite a user to become an agent
      description: >
        Creates the enrollment and flips the account to pending_agent (still
        behaves as a user). The account must be active with role user; an
        existing live enrollment is a conflict.
      operationId: promoteUserToAgent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The created enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Account not eligible (failed_precondition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account already has a live enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/enrollments/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve an enrollment
      description: >
        Promotes the candidate to agent. Only from accepted (the TOS gate),
        and only if the account is still active. v1 note - the admin verifies
        the guarantee funding manually until the payment service lands.
      operationId: approveEnrollment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The approved enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Account no longer active (failed_precondition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/enrollments/{id}/cancel:
    post:
      tags: [Admin]
      summary: Cancel an enrollment
      description: >
        Works from invited or accepted; restores the candidate's user role.
      operationId: cancelEnrollment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cancelled enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounts:
    get:
      tags: [Admin]
      summary: List accounts
      description: Optional filters; an absent parameter disables its filter.
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountRole"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountStatus"
        - name: phone_number
          in: query
          required: false
          schema:
            type: string
            example: "+243812345678"
      responses:
        "200":
          description: Matching accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccountsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      tags: [Admin]
      summary: Create a back-office account (ops or admin)
      description: >
        Provisions a staff account: Cognito identity + account row, active
        immediately — no OTP gate (staff are never self-registered). The
        route sits on the ops tier but the service requires an **admin**
        caller: the one operation where ops and admin differ. The initial
        password is handed over out-of-band; the staffer changes it through
        the normal password flow.
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateAccountRequest"
      responses:
        "200":
          description: The created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          description: Phone number already registered

  /v1/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Admin]
      summary: Get an account
      operationId: getAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin]
      summary: Update an account (moderation)
      description: >
        Partial update including role and status changes. Setting status to
        SUSPENDED or BANNED revokes the account's refresh tokens. The path
        owns the id — an id in the body is ignored.
      operationId: adminUpdateAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateAccountRequest"
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete an account
      description: Soft-deletes the local row and deletes the Cognito user.
      operationId: deleteAccount
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transfers/operators:
    get:
      tags: [Transfers]
      summary: List available operators for a corridor
      description: >
        The v1 catalogue (all three operators serve both currencies).
        Rejects the cdf→usd pair — not a corridor.
      operationId: getAvailableOperators
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Currency"
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Currency"
      responses:
        "200":
          description: The operators
          content:
            application/json:
              schema:
                type: object
                properties:
                  operators:
                    type: array
                    items:
                      $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/transfers/quote:
    post:
      tags: [Transfers]
      summary: Get a quote
      description: >
        Stateless — nothing is persisted; the rate locks at create. The
        cached rate bounds display-vs-locked drift to the FX cache TTL
        (5 minutes).
      operationId: getQuote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetQuoteRequest"
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/transfers:
    post:
      tags: [Transfers]
      summary: Create a transfer
      description: >
        Locks the rate, stamps every money value, saves/refreshes the
        beneficiary when inline recipient details are given, and starts
        matching immediately.
      operationId: createTransfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "200":
          description: The created transfer (pending_match)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Transfers]
      summary: List my transfers
      operationId: listTransfers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransferStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: My transfers, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransfersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/transfers/{id}:
    get:
      tags: [Transfers]
      summary: Get a transfer
      description: >
        Visible to its owner (payment details of the matched agent's
        wallet attached), the assigned agent, and ops.
      operationId: getTransfer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transfers/{id}/events:
    get:
      tags: [Transfers]
      summary: Get a transfer's timeline
      operationId: listTransferEvents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The timeline, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransferEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transfers/{id}/files:
    get:
      tags: [Transfers]
      summary: List a transfer's proofs (party-scoped)
      description: >
        The proofs attached to a transfer, readable by every party —
        the client, the assigned agent and ops. Use this (not GET
        /v1/files/{id}, which is owner-only) to show the counterpart's
        proof: the client's payment proof to the agent, the agent's
        payout proof to the client. Each entry carries a presigned
        download URL once the file is stored. A transfer that isn't
        yours reads as 404.
      operationId: listTransferFiles
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The transfer's files, with download URLs when stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        file:
                          $ref: "#/components/schemas/File"
                        download_url:
                          type: string
                          description: Presigned GET, only once stored.
                        download_url_expires_in:
                          type: integer
                          format: int64
                          description: Seconds until the URL expires.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transfers/{id}/confirm:
    post:
      tags: [Transfers]
      summary: Confirm receipt
      description: >
        The only human path to done — releases the agent's guarantee
        hold. Auto-confirms after 24h of inactivity.
      operationId: confirmReceipt
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The completed transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transfers/{id}/cancel:
    post:
      tags: [Transfers]
      summary: Cancel my transfer (pre-accept only)
      description: >
        Only before an agent committed (pending_match /
        pending_agent_approval). Post-accept exits are the payment
        timeout or an admin cancel.
      operationId: cancelTransfer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: The cancelled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/beneficiaries:
    get:
      tags: [Transfers]
      summary: List my saved recipients
      operationId: listBeneficiaries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: My beneficiaries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  beneficiaries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Beneficiary"
    post:
      tags: [Transfers]
      summary: Save a recipient
      description: >
        Saves a recipient ahead of any transfer. Idempotent on the phone:
        re-adding a live one refreshes its details instead of erroring —
        the same upsert a transfer with inline recipient details performs.
      operationId: addBeneficiary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, operator]
              properties:
                name:
                  type: string
                  example: Marie Kabila
                phone:
                  type: string
                  description: Where the recipient is paid, off-platform.
                  example: "+243821234567"
                operator:
                  $ref: "#/components/schemas/Operator"
                city:
                  type: string
      responses:
        "200":
          description: The saved beneficiary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/beneficiaries/{id}:
    patch:
      tags: [Transfers]
      summary: Update a saved recipient
      description: >
        Owner-scoped partial update — absent fields keep their value.
        Editing a beneficiary never rewrites past transfers (each
        transfer keeps its own recipient snapshot). Changing the phone
        to one another live saved recipient already uses returns 409.
      operationId: updateBeneficiary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  example: "+243821234567"
                operator:
                  $ref: "#/components/schemas/Operator"
                city:
                  type: string
      responses:
        "200":
          description: The updated beneficiary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another saved recipient already uses this phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Transfers]
      summary: Delete a saved recipient
      operationId: deleteBeneficiary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted (idempotent)

  /v1/agent/profile:
    get:
      tags: [Agent]
