  /v1/admin/transfers/{id}/cancel:
    post:
      tags: [PaymentAdmin]
      summary: Cancel a transfer (any open state)
      description: >
        The ops escape hatch — releases the agent's hold when one is
        placed. The reason lands on the timeline.
      operationId: cancelTransferAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required: [reason]
      responses:
        "200":
          description: The cancelled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/files:
    post:
      tags: [Files]
      summary: Register an upload, get the presigned PUT URL
      description: >
        Validates purpose/mime/size and returns the URL to PUT the bytes
        to (Content-Type must match). Then call confirm. For proofs,
        related_type/related_id name the entity the file advances
        ("transfer", "ledger_request").
      operationId: createUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "200":
          description: The pending file + upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Files]
      summary: List files attached to an entity
      operationId: listFiles
      security:
        - bearerAuth: []
      parameters:
        - name: related_type
          in: query
          required: true
          schema:
            type: string
            example: transfer
        - name: related_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: purpose
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FilePurpose"
      responses:
        "200":
          description: The files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFilesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/files/{id}:
    get:
      tags: [Files]
      summary: Get a file (+ presigned download URL once stored)
      description: >
        Owner-only (ops sees everything): you can only fetch files you
        uploaded. To view the counterpart's proof on a transfer, use
        GET /v1/transfers/{id}/files — party scope lives with the
        transfer, not the file.
      operationId: getFile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The file + download URL when stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFileResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/files/{id}/confirm:
    post:
      tags: [Files]
      summary: Confirm the upload
      description: >
        Verifies the object landed (existence + declared size), hashes
        it, marks the file stored and kicks the proof consumer (ledger
        forward / transfer status move) via the background worker.
      operationId: confirmUpload
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The stored file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/files/{id}/reject:
    post:
      tags: [Files]
      summary: Reject a file (bad proof) — ops
      operationId: rejectFile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The rejected file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agent/ledger/requests:
    get:
      tags: [Ledger]
      summary: List my ledger requests
      description: >
        Always scoped to my own profile, whatever filters say. Pending
        agents included — this is how G2 finds the enrollment guarantee
        request (filter type=LEDGER_REQUEST_TYPE_FUNDING and copy its ref).
      operationId: listMyLedgerRequests
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LedgerRequestStatus"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LedgerRequestType"
      responses:
        "200":
          description: My requests, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLedgerRequestsResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      tags: [Ledger]
      summary: Create a funding or withdrawal request (mine)
      description: >
        Agent-only types: FUNDING (deposit — then upload the deposit
        proof) and WITHDRAWAL (reserves the amount immediately; fails on
        insufficient available or the guarantee floor). The profile
        resolves from my token.
      operationId: createMyLedgerRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLedgerRequestRequest"
      responses:
        "200":
          description: The created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

