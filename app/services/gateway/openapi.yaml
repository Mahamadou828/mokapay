openapi: 3.0.3
info:
  title: Gateway API
  version: "1.0.0"
  description: >
    REST gateway over the project's gRPC services. Each endpoint proxies to a
    gRPC RPC; request/response bodies are proto3-JSON (snake_case field names,
    enums as their full string names, int64 as JSON strings, timestamps as
    RFC 3339). List filters are passed as query parameters; create/update
    bodies mirror the corresponding gRPC request message. Errors map gRPC
    status codes to HTTP and return an Error body.

servers:
  - url: http://localhost:8080
    description: Local gateway (go run)
  - url: http://localhost:8085
    description: Docker compose gateway (host 8085 → container 8080)

tags:
  - name: Health
  - name: Auth
    description: Anonymous authentication flows (Cognito-backed, SMS-OTP second factor)
  - name: Account
    description: Self-service account routes — the caller is the token's identity
  - name: Notifications
    description: In-app inbox + web-push subscription management (self-service)
  - name: Enrollment
    description: >
      Agent enrollment — the candidate side (view, accept terms, decline);
      the admin side lives under the Admin tag
  - name: Admin
    description: Account moderation — requires the ops or admin role
  - name: Transfers
    description: >
      The client transfer flow — operators, stateless quote, create (rate
      locked once), reads, receipt confirmation, pre-accept cancel, saved
      beneficiaries. Amounts are minor units (USD cents; CDF whole francs).
  - name: Agent
    description: >
      The agent surface — profile, broadcast-offer inbox, accept/decline,
      assignments, wallet self-service. Requires the agent role
      (pending_agent may read profile/wallets).
  - name: PaymentAdmin
    description: Transfer moderation — requires the ops or admin role

paths:
  /v1/readiness:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: readiness
      responses:
        "204":
          description: Service ready

  /v1/liveness:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: liveness
      responses:
        "204":
          description: Service alive

  /v1/auth/otp:
    post:
      tags: [Auth]
      summary: Send an SMS OTP
      description: >
        Sends a one-time code by SMS for the given purpose (register, login or
        password reset). The code never appears in the response.
      operationId: sendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOtpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: >
        Creates the account (Cognito + local row). Requires a REGISTER OTP
        obtained via /v1/auth/otp.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Account created, session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Phone number or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: >
        Single call: phone + password + LOGIN OTP (obtained via /v1/auth/otp)
        together. Suspended/banned accounts are rejected.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the session
      description: >
        Exchanges a refresh token for new tokens. `sub` is the Cognito subject
        read from the access token's `sub` claim (Cognito derives the refresh
        SECRET_HASH from it).
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/auth/password:
    post:
      tags: [Auth]
      summary: Reset the password
      description: >
        Sets a new password using a RESET OTP obtained via /v1/auth/otp.
        Anonymous — this is the forgot-password flow.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out everywhere
      description: >
        Cognito global sign-out — revokes every refresh token of the calling
        account. The access token stays valid until it expires.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/me:
    get:
      tags: [Account]
      summary: Get my account
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    patch:
      tags: [Account]
      summary: Update my account
      description: Partial update — absent fields keep their stored value.
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/push/vapid-key:
    get:
      tags: [Notifications]
      summary: VAPID public key
      description: >
        The application server key the frontend passes to
        PushManager.subscribe(). Empty when the backend runs without VAPID
        keys (dev mode — pushes are logged, not delivered).
      operationId: getVapidPublicKey
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key:
                    type: string

  /v1/notifications:
    get:
      tags: [Notifications]
      summary: List my notifications
      description: The caller's inbox, newest first.
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NotificationStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            description: Max rows (default 50, cap 200)
      responses:
        "200":
          description: The inbox slice
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification read
      description: Idempotent — re-reading keeps the original read timestamp.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all my notifications read
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Backlog cleared
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/push/subscriptions:
    post:
      tags: [Notifications]
      summary: Register this device for web push
      description: >
        Body is the flattened PushSubscription from PushManager.subscribe().
        Re-subscribing the same endpoint refreshes the keys (upsert). The
        device hint is taken from the User-Agent header.
      operationId: subscribePush
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribePushRequest"
      responses:
        "204":
          description: Subscribed
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    delete:
      tags: [Notifications]
      summary: Unregister this device
      description: Unknown endpoints no-op (unsubscribe is idempotent).
      operationId: unsubscribePush
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
              required: [endpoint]
      responses:
        "204":
          description: Unsubscribed
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/enrollment:
    get:
      tags: [Enrollment]
      summary: My enrollment
      description: The caller's latest enrollment request, whatever its status.
      operationId: getMyEnrollment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          description: Never invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/enrollment/accept:
    post:
      tags: [Enrollment]
      summary: Accept the agent terms
      description: >
        Stamps the TOS acceptance. tos_version must be the current version —
        a stale one (the client displayed outdated terms) is rejected with
        failed_precondition. Only works while the enrollment is invited.
      operationId: acceptEnrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: The enrollment id (from GET /v1/enrollment)
                tos_version:
                  type: string
                  example: "1.0"
              required: [id, tos_version]
      responses:
        "200":
          description: The accepted enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid id, or stale tos_version (failed_precondition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/enrollment/decline:
    post:
      tags: [Enrollment]
      summary: Decline the invitation
      description: >
        Restores the user role. Only works while the enrollment is invited —
        after accepting the terms, exiting goes through an admin cancel.
      operationId: declineEnrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
              required: [id]
      responses:
        "200":
          description: The declined enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/enrollments:
    get:
      tags: [Admin]
      summary: List enrollments
      description: The enrollment dashboard; filter by status to find the worklist.
      operationId: listEnrollments
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EnrollmentStatus"
      responses:
        "200":
          description: Matching enrollments, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/accounts/{id}/promote:
    post:
      tags: [Admin]
      summary: Invite a user to become an agent
      description: >
        Creates the enrollment and flips the account to pending_agent (still
        behaves as a user). The account must be active with role user; an
        existing live enrollment is a conflict.
      operationId: promoteUserToAgent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The created enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Account not eligible (failed_precondition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account already has a live enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/enrollments/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve an enrollment
      description: >
        Promotes the candidate to agent. Only from accepted (the TOS gate),
        and only if the account is still active. v1 note - the admin verifies
        the guarantee funding manually until the payment service lands.
      operationId: approveEnrollment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The approved enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Account no longer active (failed_precondition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/enrollments/{id}/cancel:
    post:
      tags: [Admin]
      summary: Cancel an enrollment
      description: >
        Works from invited or accepted; restores the candidate's user role.
      operationId: cancelEnrollment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cancelled enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounts:
    get:
      tags: [Admin]
      summary: List accounts
      description: Optional filters; an absent parameter disables its filter.
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountRole"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountStatus"
        - name: phone_number
          in: query
          required: false
          schema:
            type: string
            example: "+243812345678"
      responses:
        "200":
          description: Matching accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccountsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Admin]
      summary: Get an account
      operationId: getAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin]
      summary: Update an account (moderation)
      description: >
        Partial update including role and status changes. Setting status to
        SUSPENDED or BANNED revokes the account's refresh tokens. The path
        owns the id — an id in the body is ignored.
      operationId: adminUpdateAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateAccountRequest"
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete an account
      description: Soft-deletes the local row and deletes the Cognito user.
      operationId: deleteAccount
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transfers/operators:
    get:
      tags: [Transfers]
      summary: List available operators for a corridor
      description: >
        The v1 catalogue (all three operators serve both currencies).
        Rejects the cdf→usd pair — not a corridor.
      operationId: getAvailableOperators
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Currency"
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Currency"
      responses:
        "200":
          description: The operators
          content:
            application/json:
              schema:
                type: object
                properties:
                  operators:
                    type: array
                    items:
                      $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/transfers/quote:
    post:
      tags: [Transfers]
      summary: Get a quote
      description: >
        Stateless — nothing is persisted; the rate locks at create. The
        cached rate bounds display-vs-locked drift to the FX cache TTL
        (5 minutes).
      operationId: getQuote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetQuoteRequest"
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/transfers:
    post:
      tags: [Transfers]
      summary: Create a transfer
      description: >
        Locks the rate, stamps every money value, saves/refreshes the
        beneficiary when inline recipient details are given, and starts
        matching immediately.
      operationId: createTransfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "200":
          description: The created transfer (pending_match)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Transfers]
      summary: List my transfers
      operationId: listTransfers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransferStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: My transfers, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransfersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/transfers/{id}:
    get:
      tags: [Transfers]
      summary: Get a transfer
      description: >
        Visible to its owner (payment details of the matched agent's
        wallet attached), the assigned agent, and ops.
      operationId: getTransfer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transfers/{id}/events:
    get:
      tags: [Transfers]
      summary: Get a transfer's timeline
      operationId: listTransferEvents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The timeline, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransferEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transfers/{id}/confirm:
    post:
      tags: [Transfers]
      summary: Confirm receipt
      description: >
        The only human path to done — releases the agent's guarantee
        hold. Auto-confirms after 24h of inactivity.
      operationId: confirmReceipt
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The completed transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/transfers/{id}/cancel:
    post:
      tags: [Transfers]
      summary: Cancel my transfer (pre-accept only)
      description: >
        Only before an agent committed (pending_match /
        pending_agent_approval). Post-accept exits are the payment
        timeout or an admin cancel.
      operationId: cancelTransfer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: The cancelled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/beneficiaries:
    get:
      tags: [Transfers]
      summary: List my saved recipients
      operationId: listBeneficiaries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: My beneficiaries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  beneficiaries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Beneficiary"

  /v1/beneficiaries/{id}:
    delete:
      tags: [Transfers]
      summary: Delete a saved recipient
      operationId: deleteBeneficiary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted (idempotent)

  /v1/agent/profile:
    get:
      tags: [Agent]
      summary: Get my agent profile
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The profile (balance / held / available)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agent/offers:
    get:
      tags: [Agent]
      summary: List my offers
      description: Default = live inbox (offered), soonest-expiring first.
      operationId: listMyOffers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfferStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The offers with their money summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Offer"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/agent/offers/{id}/accept:
    post:
      tags: [Agent]
      summary: Accept an offer
      description: >
        First accept wins — reserves hold_amount on the guarantee and
        voids the sibling offers. 400 (failed_precondition) when the
        available balance cannot cover the hold; 404 when the offer is
        gone (lost the race, expired, withdrawn).
      operationId: acceptOffer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The transfer, now assigned to me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agent/offers/{id}/decline:
    post:
      tags: [Agent]
      summary: Decline an offer
      description: Takes me out of this transfer for good.
      operationId: declineOffer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The declined offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agent/transfers:
    get:
      tags: [Agent]
      summary: List my assigned transfers
      operationId: listMyTransfers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransferStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: My assignments, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransfersResponse"

  /v1/agent/wallets:
    get:
      tags: [Agent]
      summary: List my wallets
      operationId: listMyWallets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: My declared {operator, currency} channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentWallet"
    post:
      tags: [Agent]
      summary: Declare a wallet
      description: >
        One wallet per {operator, currency} pair; remove then re-add to
        change the msisdn. The msisdn is what clients pay after a match.
      operationId: addWallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWalletRequest"
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWallet"
        "409":
          description: Pair already declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agent/wallets/{id}:
    delete:
      tags: [Agent]
      summary: Remove a wallet
      operationId: removeWallet
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Removed (idempotent)

  /v1/admin/transfers:
    get:
      tags: [PaymentAdmin]
      summary: List all transfers (ops worklist)
      operationId: listAllTransfers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransferStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Matching transfers, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransfersResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/admin/transfers/{id}/cancel:
    post:
      tags: [PaymentAdmin]
      summary: Cancel a transfer (any open state)
      description: >
        The ops escape hatch — releases the agent's hold when one is
        placed. The reason lands on the timeline.
      operationId: cancelTransferAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required: [reason]
      responses:
        "200":
          description: The cancelled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token from /v1/auth/login, /register or /refresh.

  responses:
    BadRequest:
      description: Invalid request (malformed body, bad enum name, business validation)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Wrong credentials or expired/revoked session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PermissionDenied:
      description: Missing/invalid token, or insufficient role on an ops route
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No account with this id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: Uniform error body for every non-2xx response.
      properties:
        code:
          type: string
          description: Machine-readable code mirroring the gRPC status vocabulary.
          example: invalid_argument
          enum:
            - invalid_argument
            - not_found
            - already_exists
            - permission_denied
            - unauthenticated
            - failed_precondition
            - too_many_requests
            - internal
            - unavailable
        message:
          type: string
          example: invalid phone number
      required: [code, message]

    AccountRole:
      type: string
      description: Full proto enum names, both in bodies and query parameters.
      enum:
        - ACCOUNT_ROLE_USER
        - ACCOUNT_ROLE_PENDING_AGENT
        - ACCOUNT_ROLE_AGENT
        - ACCOUNT_ROLE_OPS
        - ACCOUNT_ROLE_ADMIN

    AccountStatus:
      type: string
      enum:
        - ACCOUNT_STATUS_PENDING
        - ACCOUNT_STATUS_ACTIVE
        - ACCOUNT_STATUS_SUSPENDED
        - ACCOUNT_STATUS_BANNED

    Language:
      type: string
      enum:
        - LANGUAGE_FR
        - LANGUAGE_EN

    OtpPurpose:
      type: string
      enum:
        - OTP_PURPOSE_REGISTER
        - OTP_PURPOSE_LOGIN
        - OTP_PURPOSE_RESET

    SendOtpRequest:
      type: object
      properties:
        phone_number:
          type: string
          description: E.164
          example: "+243812345678"
        purpose:
          $ref: "#/components/schemas/OtpPurpose"
      required: [phone_number, purpose]

    SendOtpResponse:
      type: object
      properties:
        expires_in_seconds:
          type: string
          description: proto3 int64 — serialized as a JSON string.
          example: "299"

    RegisterRequest:
      type: object
      properties:
        phone_number:
          type: string
          example: "+243812345678"
        code:
          type: string
          description: REGISTER OTP from /v1/auth/otp
        password:
          type: string
          format: password
        first_name:
          type: string
        last_name:
          type: string
        preferred_language:
          $ref: "#/components/schemas/Language"
        email:
          type: string
          format: email
      required: [phone_number, code, password, first_name, last_name, preferred_language]

    LoginRequest:
      type: object
      properties:
        phone_number:
          type: string
          example: "+243812345678"
        password:
          type: string
          format: password
        code:
          type: string
          description: LOGIN OTP from /v1/auth/otp
      required: [phone_number, password, code]

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
        sub:
          type: string
          description: Cognito subject — the `sub` claim of the access token.
      required: [refresh_token, sub]

    ChangePasswordRequest:
      type: object
      properties:
        code:
          type: string
          description: RESET OTP from /v1/auth/otp
        new_password:
          type: string
          format: password
        phone_number:
          type: string
          example: "+243812345678"
      required: [code, new_password, phone_number]

    AuthResponse:
      type: object
      description: Tokens only — fetch the profile via GET /v1/me.
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_in:
          type: string
          description: Seconds; proto3 int64 — serialized as a JSON string.
          example: "3600"

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone_number:
          type: string
          description: E.164
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          description: Absent when not set.
        preferred_language:
          $ref: "#/components/schemas/Language"
        role:
          $ref: "#/components/schemas/AccountRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        last_login_at:
          type: string
          format: date-time
          description: Absent if the account never logged in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateAccountRequest:
      type: object
      description: Self-service partial update — absent fields keep their value.
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        preferred_language:
          $ref: "#/components/schemas/Language"

    AdminUpdateAccountRequest:
      type: object
      description: Moderation partial update — absent fields keep their value.
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        preferred_language:
          $ref: "#/components/schemas/Language"
        role:
          $ref: "#/components/schemas/AccountRole"
        status:
          $ref: "#/components/schemas/AccountStatus"

    NotificationStatus:
      type: string
      enum:
        - NOTIFICATION_STATUS_UNREAD
        - NOTIFICATION_STATUS_READ

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        event_type:
          type: string
          description: Producer-owned vocabulary (transfer.offered, file.rejected, …)
          example: transfer.offered
        title:
          type: string
        body:
          type: string
        data:
          type: string
          description: >
            JSON payload for deep links, opaque to the backend. JSONB
            canonicalizes formatting — do not byte-compare.
        status:
          $ref: "#/components/schemas/NotificationStatus"
        read_at:
          type: string
          format: date-time
          description: Absent while unread.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscribePushRequest:
      type: object
      description: The PushSubscription object from PushManager.subscribe(), flattened.
      properties:
        endpoint:
          type: string
          example: "https://fcm.googleapis.com/fcm/send/…"
        p256dh:
          type: string
          description: Client public key (subscription.getKey('p256dh'), base64url)
        auth:
          type: string
          description: Client auth secret (subscription.getKey('auth'), base64url)
      required: [endpoint, p256dh, auth]

    EnrollmentStatus:
      type: string
      enum:
        - ENROLLMENT_STATUS_INVITED
        - ENROLLMENT_STATUS_ACCEPTED
        - ENROLLMENT_STATUS_DECLINED
        - ENROLLMENT_STATUS_APPROVED
        - ENROLLMENT_STATUS_CANCELLED

    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: The candidate
        invited_by:
          type: string
          format: uuid
          description: The ops/admin who invited
        status:
          $ref: "#/components/schemas/EnrollmentStatus"
        tos_version:
          type: string
          description: Present once accepted.
        tos_accepted_at:
          type: string
          format: date-time
        decided_by:
          type: string
          format: uuid
          description: Admin on approve/cancel, the candidate on decline.
        decided_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    Currency:
      type: string
      enum:
        - CURRENCY_USD
        - CURRENCY_CDF

    Operator:
      type: string
      enum:
        - OPERATOR_ORANGE_MONEY
        - OPERATOR_M_PESA
        - OPERATOR_AIRTEL_MONEY

    TransferStatus:
      type: string
      enum:
        - TRANSFER_STATUS_PENDING_MATCH
        - TRANSFER_STATUS_PENDING_AGENT_APPROVAL
        - TRANSFER_STATUS_PENDING_CLIENT_TRANSFER
        - TRANSFER_STATUS_PENDING_AGENT_TRANSFER
        - TRANSFER_STATUS_PENDING_CLIENT_CONFIRMATION
        - TRANSFER_STATUS_DONE
        - TRANSFER_STATUS_CANCELLED
        - TRANSFER_STATUS_EXPIRED
        - TRANSFER_STATUS_DISPUTED

    OfferStatus:
      type: string
      enum:
        - OFFER_STATUS_OFFERED
        - OFFER_STATUS_ACCEPTED
        - OFFER_STATUS_DECLINED
        - OFFER_STATUS_VOIDED
        - OFFER_STATUS_EXPIRED

    GetQuoteRequest:
      type: object
      description: Amounts are minor units of from_currency (USD cents, CDF whole francs).
      properties:
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_amount:
          type: string
          description: int64 as JSON string (proto3-JSON)
          example: "10000"
        to_currency:
          $ref: "#/components/schemas/Currency"
      required: [from_currency, from_amount, to_currency]

    Quote:
      type: object
      properties:
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_amount:
          type: string
        to_currency:
          $ref: "#/components/schemas/Currency"
        to_amount:
          type: string
        fee_pct:
          type: string
          example: "2.00"
        fee_amount:
          type: string
        margin_amount:
          type: string
        total_amount:
          type: string
          description: from_amount + fee_amount — what the client pays
        rate:
          type: string
          description: Absent on same-currency corridors.
          example: "2830.000000"

    CreateTransferRequest:
      type: object
      description: >
        Either beneficiary_id or the inline recipient trio
        (name/phone/operator). Inline details also save/refresh the
        beneficiary.
      properties:
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_operator:
          $ref: "#/components/schemas/Operator"
        from_amount:
          type: string
        to_currency:
          $ref: "#/components/schemas/Currency"
        beneficiary_id:
          type: string
          format: uuid
        recipient_name:
          type: string
        recipient_phone:
          type: string
          example: "+243812345678"
        recipient_operator:
          $ref: "#/components/schemas/Operator"
        recipient_city:
          type: string
        note:
          type: string
          description: Passed to the agent.
      required: [from_currency, from_operator, from_amount, to_currency]

    AgentPaymentDetails:
      type: object
      description: Where the client sends the money after a match.
      properties:
        operator:
          $ref: "#/components/schemas/Operator"
        msisdn:
          type: string

    Transfer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: "MKP-2026-000042"
        client_id:
          type: string
          format: uuid
        beneficiary_id:
          type: string
          format: uuid
        recipient_name:
          type: string
        recipient_phone:
          type: string
        recipient_operator:
          $ref: "#/components/schemas/Operator"
        recipient_city:
          type: string
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_operator:
          $ref: "#/components/schemas/Operator"
        from_amount:
          type: string
        to_currency:
          $ref: "#/components/schemas/Currency"
        to_amount:
          type: string
        fee_pct:
          type: string
        fee_amount:
          type: string
        margin_amount:
          type: string
        total_amount:
          type: string
        rate:
          type: string
          description: Absent on same-currency corridors.
        hold_amount:
          type: string
          description: USD minor units reserved on the agent at accept.
        note:
          type: string
        status:
          $ref: "#/components/schemas/TransferStatus"
        agent_profile_id:
          type: string
          format: uuid
        match_round:
          type: integer
        proof_client_file_id:
          type: string
          format: uuid
        proof_agent_file_id:
          type: string
          format: uuid
        agent_payment_details:
          $ref: "#/components/schemas/AgentPaymentDetails"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TransferEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transfer_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          description: Absent = system/timer.
        from_status:
          $ref: "#/components/schemas/TransferStatus"
        to_status:
          $ref: "#/components/schemas/TransferStatus"
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    ListTransfersResponse:
      type: object
      properties:
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"

    Offer:
      type: object
      description: An inbox offer with the money summary the agent decides on.
      properties:
        id:
          type: string
          format: uuid
        transfer_id:
          type: string
          format: uuid
        agent_profile_id:
          type: string
          format: uuid
        match_round:
          type: integer
        score:
          type: integer
        status:
          $ref: "#/components/schemas/OfferStatus"
        expires_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        transfer_reference:
          type: string
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_operator:
          $ref: "#/components/schemas/Operator"
        from_amount:
          type: string
        to_currency:
          $ref: "#/components/schemas/Currency"
        recipient_operator:
          $ref: "#/components/schemas/Operator"
        recipient_city:
          type: string
        to_amount:
          type: string
        total_amount:
          type: string
        hold_amount:
          type: string
          description: What accepting reserves (USD minor units).
        note:
          type: string

    Beneficiary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        operator:
          $ref: "#/components/schemas/Operator"
        city:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - AGENT_PROFILE_STATUS_PENDING
            - AGENT_PROFILE_STATUS_ACTIVE
            - AGENT_PROFILE_STATUS_SUSPENDED
        level:
          type: string
          enum:
            - AGENT_LEVEL_N1
            - AGENT_LEVEL_N2
            - AGENT_LEVEL_N3
            - AGENT_LEVEL_N4
        currency:
          type: string
          example: USD
        balance:
          type: string
          description: Minor units.
        held:
          type: string
          description: Reserved by open outflows + accepted transfers.
        available:
          type: string
          description: balance − held, derived.
        guarantee_floor:
          type: string
          description: Not withdrawable.
        city:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentWallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_profile_id:
          type: string
          format: uuid
        operator:
          $ref: "#/components/schemas/Operator"
        currency:
          $ref: "#/components/schemas/Currency"
        msisdn:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AddWalletRequest:
      type: object
      properties:
        operator:
          $ref: "#/components/schemas/Operator"
        currency:
          $ref: "#/components/schemas/Currency"
        msisdn:
          type: string
          example: "+243990000001"
      required: [operator, currency, msisdn]
