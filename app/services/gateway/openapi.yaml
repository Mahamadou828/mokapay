  /v1/agent/deposit-channels:
    get:
      tags: [Agent]
      summary: List the official deposit channels
      description: >
        The platform's official receiving accounts for funding deposits
        (G2 "fund your guarantee" / deposits): server-owned configuration —
        render exactly what this returns, never hardcode an account number
        app-side. Available to agents and pending agents (the guarantee is
        funded during enrollment).
      operationId: listDepositChannels
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/DepositChannel"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/agent/offers:
    get:
      tags: [Agent]
      summary: List my offers
      description: Default = live inbox (offered), soonest-expiring first.
      operationId: listMyOffers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfferStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The offers with their money summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Offer"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /v1/agent/offers/{id}/accept:
    post:
      tags: [Agent]
      summary: Accept an offer
      description: >
        First accept wins — reserves hold_amount on the guarantee and
        voids the sibling offers. 400 (failed_precondition) when the
        available balance cannot cover the hold; 404 when the offer is
        gone (lost the race, expired, withdrawn).
      operationId: acceptOffer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The transfer, now assigned to me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agent/offers/{id}/decline:
    post:
      tags: [Agent]
      summary: Decline an offer
      description: Takes me out of this transfer for good.
      operationId: declineOffer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The declined offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agent/transfers:
    get:
      tags: [Agent]
      summary: List my assigned transfers
      operationId: listMyTransfers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransferStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: My assignments, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransfersResponse"

  /v1/agent/wallets:
    get:
      tags: [Agent]
      summary: List my wallets
      operationId: listMyWallets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: My declared {operator, currency} channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentWallet"
    post:
      tags: [Agent]
      summary: Declare a wallet
      description: >
        One wallet per {operator, currency} pair; remove then re-add to
        change the msisdn. The msisdn is what clients pay after a match.
      operationId: addWallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWalletRequest"
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentWallet"
        "409":
          description: Pair already declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agent/wallets/{id}:
    delete:
      tags: [Agent]
      summary: Remove a wallet
      operationId: removeWallet
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Removed (idempotent)

  /v1/admin/transfers:
    get:
