        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/agent-profiles/{id}/suspend:
    post:
      tags: [Ledger]
      summary: Suspend an agent profile (idempotent)
      operationId: suspendAgentProfile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400":
          description: Illegal transition (e.g. suspending a pending profile)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token from /v1/auth/login, /register or /refresh.

  responses:
    BadRequest:
      description: Invalid request (malformed body, bad enum name, business validation)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Wrong credentials or expired/revoked session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PermissionDenied:
      description: Missing/invalid token, or insufficient role on an ops route
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No account with this id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: Uniform error body for every non-2xx response.
      properties:
        code:
          type: string
          description: Machine-readable code mirroring the gRPC status vocabulary.
          example: invalid_argument
          enum:
            - invalid_argument
            - not_found
            - already_exists
            - permission_denied
            - unauthenticated
            - failed_precondition
            - too_many_requests
            - internal
            - unavailable
        message:
          type: string
          example: invalid phone number
      required: [code, message]

    AccountRole:
      type: string
      description: Full proto enum names, both in bodies and query parameters.
      enum:
        - ACCOUNT_ROLE_USER
        - ACCOUNT_ROLE_PENDING_AGENT
        - ACCOUNT_ROLE_AGENT
        - ACCOUNT_ROLE_OPS
        - ACCOUNT_ROLE_ADMIN

    AccountStatus:
      type: string
      enum:
        - ACCOUNT_STATUS_PENDING
        - ACCOUNT_STATUS_ACTIVE
        - ACCOUNT_STATUS_SUSPENDED
        - ACCOUNT_STATUS_BANNED

    Language:
      type: string
      enum:
        - LANGUAGE_FR
        - LANGUAGE_EN

    OtpPurpose:
      type: string
      enum:
        - OTP_PURPOSE_REGISTER
        - OTP_PURPOSE_LOGIN
        - OTP_PURPOSE_RESET

    SendOtpRequest:
      type: object
      properties:
        phone_number:
          type: string
          description: E.164
          example: "+243812345678"
        purpose:
          $ref: "#/components/schemas/OtpPurpose"
      required: [phone_number, purpose]

    SendOtpResponse:
      type: object
      properties:
        expires_in_seconds:
          type: string
          description: proto3 int64 — serialized as a JSON string.
          example: "299"

    RegisterRequest:
      type: object
      properties:
        phone_number:
          type: string
          example: "+243812345678"
        code:
          type: string
          description: REGISTER OTP from /v1/auth/otp
        password:
          type: string
          format: password
        first_name:
          type: string
        last_name:
          type: string
        preferred_language:
          $ref: "#/components/schemas/Language"
        email:
          type: string
          format: email
      required: [phone_number, code, password, first_name, last_name, preferred_language]

    LoginRequest:
      type: object
      properties:
        phone_number:
          type: string
          example: "+243812345678"
        password:
          type: string
          format: password
        code:
          type: string
          description: LOGIN OTP from /v1/auth/otp
      required: [phone_number, password, code]

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
        sub:
          type: string
          description: Cognito subject — the `sub` claim of the access token.
      required: [refresh_token, sub]

    ChangePasswordRequest:
      type: object
      properties:
        code:
          type: string
          description: RESET OTP from /v1/auth/otp
        new_password:
          type: string
          format: password
        phone_number:
          type: string
          example: "+243812345678"
      required: [code, new_password, phone_number]

    AuthResponse:
      type: object
      description: Tokens only — fetch the profile via GET /v1/me.
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_in:
          type: string
          description: Seconds; proto3 int64 — serialized as a JSON string.
          example: "3600"

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone_number:
          type: string
          description: E.164
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          description: Absent when not set.
        preferred_language:
          $ref: "#/components/schemas/Language"
        role:
          $ref: "#/components/schemas/AccountRole"
        status:
          $ref: "#/components/schemas/AccountStatus"
        last_login_at:
          type: string
          format: date-time
          description: Absent if the account never logged in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateAccountRequest:
      type: object
      description: Self-service partial update — absent fields keep their value.
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        preferred_language:
          $ref: "#/components/schemas/Language"

    AdminCreateAccountRequest:
      type: object
      required: [phone_number, password, first_name, last_name, role]
      properties:
        phone_number:
          type: string
          example: "+243812345678"
        password:
          type: string
          description: Initial password (Cognito policy applies), handed over out-of-band.
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [ACCOUNT_ROLE_OPS, ACCOUNT_ROLE_ADMIN]
          description: Back-office roles only — customer roles go through register/enrollment.
        email:
          type: string
        preferred_language:
          $ref: "#/components/schemas/Language"

    AdminUpdateAccountRequest:
      type: object
      description: Moderation partial update — absent fields keep their value.
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        preferred_language:
          $ref: "#/components/schemas/Language"
        role:
          $ref: "#/components/schemas/AccountRole"
        status:
          $ref: "#/components/schemas/AccountStatus"

    NotificationStatus:
      type: string
      enum:
        - NOTIFICATION_STATUS_UNREAD
        - NOTIFICATION_STATUS_READ

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        event_type:
          type: string
          description: Producer-owned vocabulary (transfer.offered, file.rejected, …)
          example: transfer.offered
        title:
          type: string
        body:
          type: string
        data:
          type: string
          description: >
            JSON payload for deep links, opaque to the backend. JSONB
            canonicalizes formatting — do not byte-compare.
        status:
          $ref: "#/components/schemas/NotificationStatus"
        read_at:
          type: string
          format: date-time
          description: Absent while unread.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscribePushRequest:
      type: object
      description: The PushSubscription object from PushManager.subscribe(), flattened.
      properties:
        endpoint:
          type: string
          example: "https://fcm.googleapis.com/fcm/send/…"
        p256dh:
          type: string
          description: Client public key (subscription.getKey('p256dh'), base64url)
        auth:
          type: string
          description: Client auth secret (subscription.getKey('auth'), base64url)
      required: [endpoint, p256dh, auth]

    EnrollmentStatus:
      type: string
      enum:
        - ENROLLMENT_STATUS_INVITED
        - ENROLLMENT_STATUS_ACCEPTED
        - ENROLLMENT_STATUS_DECLINED
        - ENROLLMENT_STATUS_APPROVED
        - ENROLLMENT_STATUS_CANCELLED

    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: The candidate
        invited_by:
          type: string
          format: uuid
          description: The ops/admin who invited
        status:
          $ref: "#/components/schemas/EnrollmentStatus"
        tos_version:
          type: string
          description: Present once accepted.
        tos_accepted_at:
          type: string
          format: date-time
        decided_by:
          type: string
          format: uuid
          description: Admin on approve/cancel, the candidate on decline.
        decided_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    Currency:
      type: string
      enum:
        - CURRENCY_USD
        - CURRENCY_CDF

    Operator:
      type: string
      enum:
        - OPERATOR_ORANGE_MONEY
        - OPERATOR_M_PESA
        - OPERATOR_AIRTEL_MONEY

    TransferStatus:
      type: string
      enum:
        - TRANSFER_STATUS_PENDING_MATCH
        - TRANSFER_STATUS_PENDING_AGENT_APPROVAL
        - TRANSFER_STATUS_PENDING_CLIENT_TRANSFER
        - TRANSFER_STATUS_PENDING_AGENT_TRANSFER
        - TRANSFER_STATUS_PENDING_CLIENT_CONFIRMATION
        - TRANSFER_STATUS_DONE
        - TRANSFER_STATUS_CANCELLED
        - TRANSFER_STATUS_EXPIRED
        - TRANSFER_STATUS_DISPUTED

    OfferStatus:
      type: string
      enum:
        - OFFER_STATUS_OFFERED
        - OFFER_STATUS_ACCEPTED
        - OFFER_STATUS_DECLINED
        - OFFER_STATUS_VOIDED
        - OFFER_STATUS_EXPIRED

    GetQuoteRequest:
      type: object
      description: >
        Exactly one of from_amount / to_amount is set — the two directions
        of the send widget. from_amount ("you send X"): what does the
        recipient get? to_amount ("recipient must get Y"): the server
        solves for the smallest send amount whose quote covers Y — the
        response's to_amount may exceed Y by a rounding sliver. Amounts
        are minor units of their own currency (USD cents, CDF whole francs).
      properties:
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_amount:
          type: string
          description: int64 as JSON string (proto3-JSON), from_currency minor units
          example: "10000"
        to_currency:
          $ref: "#/components/schemas/Currency"
        to_amount:
          type: string
          description: int64 as JSON string (proto3-JSON), to_currency minor units
          example: "281635"
      required: [from_currency, to_currency]

    Quote:
      type: object
      properties:
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_amount:
          type: string
        to_currency:
          $ref: "#/components/schemas/Currency"
        to_amount:
          type: string
        fee_pct:
          type: string
          example: "2.00"
        fee_amount:
          type: string
        margin_amount:
          type: string
        total_amount:
          type: string
          description: from_amount + fee_amount — what the client pays
        rate:
          type: string
          description: Absent on same-currency corridors.
          example: "2830.000000"

    CreateTransferRequest:
      type: object
      description: >
        Either beneficiary_id or the inline recipient trio
        (name/phone/operator). Inline details also save/refresh the
        beneficiary.
      properties:
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_operator:
          $ref: "#/components/schemas/Operator"
        from_amount:
          type: string
        to_currency:
          $ref: "#/components/schemas/Currency"
        beneficiary_id:
          type: string
          format: uuid
        recipient_name:
          type: string
        recipient_phone:
          type: string
          example: "+243812345678"
        recipient_operator:
          $ref: "#/components/schemas/Operator"
        recipient_city:
          type: string
        note:
          type: string
          description: Passed to the agent.
      required: [from_currency, from_operator, from_amount, to_currency]

    AgentPaymentDetails:
      type: object
      description: Where the client sends the money after a match.
      properties:
        operator:
          $ref: "#/components/schemas/Operator"
        msisdn:
          type: string

    Transfer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: "MKP-2026-000042"
        client_id:
          type: string
          format: uuid
        beneficiary_id:
          type: string
          format: uuid
        recipient_name:
          type: string
        recipient_phone:
          type: string
        recipient_operator:
          $ref: "#/components/schemas/Operator"
        recipient_city:
          type: string
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_operator:
          $ref: "#/components/schemas/Operator"
        from_amount:
          type: string
        to_currency:
          $ref: "#/components/schemas/Currency"
        to_amount:
          type: string
        fee_pct:
          type: string
        fee_amount:
          type: string
        margin_amount:
          type: string
        total_amount:
          type: string
        rate:
          type: string
          description: Absent on same-currency corridors.
        hold_amount:
          type: string
          description: USD minor units reserved on the agent at accept.
        note:
          type: string
        status:
          $ref: "#/components/schemas/TransferStatus"
        agent_profile_id:
          type: string
          format: uuid
        match_round:
          type: integer
        proof_client_file_id:
          type: string
          format: uuid
        proof_agent_file_id:
          type: string
          format: uuid
        agent_payment_details:
          $ref: "#/components/schemas/AgentPaymentDetails"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TransferEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transfer_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          description: Absent = system/timer.
        from_status:
          $ref: "#/components/schemas/TransferStatus"
        to_status:
          $ref: "#/components/schemas/TransferStatus"
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    ListTransfersResponse:
      type: object
      properties:
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"

    Offer:
      type: object
      description: An inbox offer with the money summary the agent decides on.
      properties:
        id:
          type: string
          format: uuid
        transfer_id:
          type: string
          format: uuid
        agent_profile_id:
          type: string
          format: uuid
        match_round:
          type: integer
        score:
          type: integer
        status:
          $ref: "#/components/schemas/OfferStatus"
        expires_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        transfer_reference:
          type: string
        from_currency:
          $ref: "#/components/schemas/Currency"
        from_operator:
          $ref: "#/components/schemas/Operator"
        from_amount:
          type: string
        to_currency:
          $ref: "#/components/schemas/Currency"
        recipient_operator:
          $ref: "#/components/schemas/Operator"
        recipient_city:
          type: string
        to_amount:
          type: string
        total_amount:
          type: string
        hold_amount:
          type: string
          description: What accepting reserves (USD minor units).
        note:
          type: string

    Beneficiary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        operator:
          $ref: "#/components/schemas/Operator"
        city:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - AGENT_PROFILE_STATUS_PENDING
            - AGENT_PROFILE_STATUS_ACTIVE
            - AGENT_PROFILE_STATUS_SUSPENDED
        level:
          type: string
          enum:
            - AGENT_LEVEL_N1
            - AGENT_LEVEL_N2
            - AGENT_LEVEL_N3
            - AGENT_LEVEL_N4
        currency:
          type: string
          example: USD
        balance:
          type: string
          description: Minor units.
        held:
          type: string
          description: Reserved by open outflows + accepted transfers.
        available:
          type: string
          description: balance − held, derived.
        guarantee_floor:
          type: string
          description: Not withdrawable.
        city:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentWallet:
      type: object
      description: One wallet per operator; the accepts_* flags say which currencies the agent serves on it.
      properties:
        id:
          type: string
          format: uuid
        agent_profile_id:
          type: string
          format: uuid
        operator:
          $ref: "#/components/schemas/Operator"
        msisdn:
          type: string
        accepts_usd:
          type: boolean
        accepts_cdf:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DepositChannel:
      type: object
      description: One official MOKA PAY receiving account. Free-form strings — the set includes banks and is ops configuration, not a domain enum.
      properties:
        name:
          type: string
          description: Display label.
          example: M-Pesa
        kind:
          type: string
          enum: [mobile_money, bank]
        account_name:
          type: string
          example: MOKA PAY SARL
        account_number:
          type: string
          description: MSISDN or bank account number.
          example: "+243815000000"
        instructions:
          type: string
          description: Extra guidance shown under the entry (optional).

    AddWalletRequest:
      type: object
      description: >
        One wallet per operator. At least one accepts_* flag must be true
        — they are the "no dollars on Orange" opt-out. Remove then re-add
        to change the msisdn or the flags.
      properties:
        operator:
          $ref: "#/components/schemas/Operator"
        msisdn:
          type: string
          example: "+243990000001"
        accepts_usd:
          type: boolean
        accepts_cdf:
          type: boolean
      required: [operator, msisdn]

    FilePurpose:
      type: string
      enum:
        - FILE_PURPOSE_SENDER_PROOF
        - FILE_PURPOSE_AGENT_PROOF
        - FILE_PURPOSE_RECIPIENT_PROOF
        - FILE_PURPOSE_DEPOSIT_PROOF
        - FILE_PURPOSE_KYC
        - FILE_PURPOSE_OTHER

    FileStatus:
      type: string
      enum:
        - FILE_STATUS_PENDING
        - FILE_STATUS_STORED
        - FILE_STATUS_REJECTED

    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/FilePurpose"
        related_type:
          type: string
          example: transfer
        related_id:
          type: string
          format: uuid
        file_name:
          type: string
          description: Original client name, display only.
        content_type:
          type: string
        size_bytes:
          type: string
        sha256:
          type: string
          description: Set once stored.
        status:
          $ref: "#/components/schemas/FileStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUploadRequest:
      type: object
      properties:
        purpose:
          $ref: "#/components/schemas/FilePurpose"
        related_type:
          type: string
          example: transfer
        related_id:
          type: string
          format: uuid
        file_name:
          type: string
        content_type:
          type: string
          example: image/jpeg
        size_bytes:
          type: string
          description: Enforced against the stored object at confirm.
      required: [purpose, file_name, content_type, size_bytes]

    CreateUploadResponse:
      type: object
      properties:
        file:
          $ref: "#/components/schemas/File"
        upload_url:
          type: string
          description: HTTP PUT target; Content-Type must match.
        upload_url_expires_in:
          type: string
          description: Seconds.

    GetFileResponse:
      type: object
      properties:
        file:
          $ref: "#/components/schemas/File"
        download_url:
          type: string
          description: Present only for stored files (1h presigned GET).
        download_url_expires_in:
          type: string

    ListFilesResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"

    LedgerRequestType:
      type: string
      enum:
        - LEDGER_REQUEST_TYPE_FUNDING
        - LEDGER_REQUEST_TYPE_WITHDRAWAL
        - LEDGER_REQUEST_TYPE_REFUND
        - LEDGER_REQUEST_TYPE_DEDUCTION
        - LEDGER_REQUEST_TYPE_COMMISSION

    LedgerRequestStatus:
      type: string
      enum:
        - LEDGER_REQUEST_STATUS_INITIATED
        - LEDGER_REQUEST_STATUS_PENDING_AGENT_ACTION
        - LEDGER_REQUEST_STATUS_PENDING_ADMIN_APPROVAL
        - LEDGER_REQUEST_STATUS_DONE
        - LEDGER_REQUEST_STATUS_REJECTED
        - LEDGER_REQUEST_STATUS_DISPUTED

    LedgerReferenceType:
      type: string
      enum:
        - LEDGER_REFERENCE_TYPE_ENROLLMENT
        - LEDGER_REFERENCE_TYPE_TRANSFER

    CreateLedgerRequestRequest:
      type: object
      description: >
        Role decides the legal types and the landing status: agents may
        FUNDING/WITHDRAWAL on their own profile (id optional — resolved
        from the token); ops may FUNDING (requires the enrollment
        reference) and REFUND. Direction and status are engine
        derivations, never wire input.
      properties:
        agent_profile_id:
          type: string
          format: uuid
          description: Required for ops; ignored/optional for agents.
        type:
          $ref: "#/components/schemas/LedgerRequestType"
        amount:
          type: string
          description: USD minor units, positive (int64 as JSON string).
          example: "2000"
        reference_entity_type:
          $ref: "#/components/schemas/LedgerReferenceType"
        reference_entity_id:
          type: string
          format: uuid
        reason:
          type: string
      required: [type, amount]

    LedgerRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
          description: >
            Human reference (DEP-2026-000042; prefix by type — DEP funding,
            WDR withdrawal, RFD refund, DED deduction, COM commission).
            The agent copies it as the motif of the off-platform payment;
            ops match the incoming money against it.
          example: DEP-2026-000042
        agent_profile_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/LedgerRequestType"
        direction:
          type: string
          enum:
            - LEDGER_DIRECTION_INFLOW
            - LEDGER_DIRECTION_OUTFLOW
